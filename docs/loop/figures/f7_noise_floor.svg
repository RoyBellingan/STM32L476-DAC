<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-label="Noise floor at D12, drive at 0, amp connected">
<rect width="760" height="430" fill="#fcfcfb"/>
<text x="72" y="24" font-size="15" font-weight="bold" fill="#0b0b0b">Noise floor at D12, drive at 0, amp connected</text>
<text x="72" y="42" font-size="11.5" fill="#52514e">Mains hum at the left; switching-supply lines with 100 Hz spacing; spikes aliased from above 25 kHz.</text>
<text x="72" y="57" font-size="11.5" fill="#52514e">With the amp connected the PGA path is only a few dB quieter (without it: 10-20 dB), so part of this</text>
<text x="72" y="72" font-size="11.5" fill="#52514e">noise enters after the PGA input.</text>
<rect x="72" y="86.5" width="18" height="3" rx="1.5" fill="#2a78d6" fill-opacity="1"/>
