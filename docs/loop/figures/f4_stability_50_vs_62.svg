<svg xmlns="http://www.w3.org/2000/svg" width="760" height="415" viewBox="0 0 760 415" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-label="Why 62.5 Hz: the same drive, read again and again">
<rect width="760" height="415" fill="#fcfcfb"/>
<text x="72" y="24" font-size="15" font-weight="bold" fill="#0b0b0b">Why 62.5 Hz: the same drive, read again and again</text>
<text x="72" y="42" font-size="11.5" fill="#52514e">DAC 0.2 V peak, reads of 0.2 s, 45 s each. At 50 Hz the mains hum beats with the source: 8.3 % p-p (σ</text>
<text x="72" y="57" font-size="11.5" fill="#52514e">2.69 %). At 62.5 Hz it does not: 1.57 % p-p (σ 0.41 %), the noise of a 0.2 s read.</text>
