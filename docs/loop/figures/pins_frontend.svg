<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <title>LoopSource input wiring: bias network to D12, 1 nF from D11 to A3</title>
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- board -->
  <rect x="410" y="100" width="300" height="270" fill="#f4f3ef" stroke="#52514e" stroke-width="1.5" rx="4"/>
  <text x="422" y="358" fill="#52514e">NUCLEO-L476RG</text>

  <g fill="none" stroke="#000" stroke-width="1.6">
    <!-- 3V3, 150 k -->
    <line x1="110" y1="52" x2="110" y2="90"/>
    <rect x="102" y="90" width="16" height="60" fill="#fff"/>
    <line x1="110" y1="150" x2="110" y2="290"/>
    <!-- 10 k to GND -->
    <rect x="102" y="290" width="16" height="50" fill="#fff"/>
    <line x1="110" y1="340" x2="110" y2="370"/>
    <line x1="98" y1="370" x2="122" y2="370"/><line x1="102" y1="375" x2="118" y2="375"/><line x1="106" y1="380" x2="114" y2="380"/>
    <!-- 10 uF to GND -->
    <line x1="110" y1="265" x2="180" y2="265"/>
    <line x1="180" y1="265" x2="180" y2="311"/>
    <line x1="166" y1="311" x2="194" y2="311"/><line x1="166" y1="319" x2="194" y2="319"/>
    <line x1="180" y1="319" x2="180" y2="370"/>
    <line x1="168" y1="370" x2="192" y2="370"/><line x1="172" y1="375" x2="188" y2="375"/><line x1="176" y1="380" x2="184" y2="380"/>
    <!-- B to 10 k to D12 -->
    <line x1="180" y1="265" x2="230" y2="265"/>
    <rect x="230" y="257" width="60" height="16" fill="#fff"/>
    <line x1="290" y1="265" x2="410" y2="265"/>
    <!-- 47 uF to Rs -->
    <line x1="340" y1="265" x2="340" y2="311"/>
    <line x1="326" y1="311" x2="354" y2="311"/><line x1="326" y1="319" x2="354" y2="319"/>
    <line x1="340" y1="319" x2="340" y2="360"/>

    <!-- internal: D12 to VINP -->
    <line x1="410" y1="265" x2="490" y2="265"/>
    <!-- op-amp -->
    <path d="M490 205 L490 285 L570 245 Z" fill="#fff"/>
    <!-- VINM node to D11 -->
    <line x1="490" y1="225" x2="460" y2="225"/>
    <line x1="460" y1="225" x2="460" y2="100"/>
    <!-- output to A3 -->
    <line x1="570" y1="245" x2="650" y2="245"/>
    <line x1="650" y1="245" x2="650" y2="100"/>
    <!-- internal R2 -->
    <line x1="460" y1="155" x2="525" y2="155"/>
    <rect x="525" y="147" width="60" height="16" fill="#fff"/>
    <line x1="585" y1="155" x2="650" y2="155"/>
    <!-- right side pins -->
    <line x1="710" y1="190" x2="745" y2="190"/>
    <line x1="710" y1="245" x2="745" y2="245"/>
    <line x1="710" y1="300" x2="745" y2="300"/>
  </g>

  <!-- the 1 nF capacitor -->
  <g fill="none" stroke="#c0392b" stroke-width="2.2">
    <line x1="460" y1="100" x2="460" y2="55"/>
    <line x1="460" y1="55" x2="551" y2="55"/>
    <line x1="551" y1="39" x2="551" y2="71"/>
    <line x1="559" y1="39" x2="559" y2="71"/>
    <line x1="559" y1="55" x2="650" y2="55"/>
    <line x1="650" y1="55" x2="650" y2="100"/>
  </g>
  <text x="555" y="27" text-anchor="middle" fill="#c0392b" font-weight="bold">1 nF, external</text>

  <!-- pin dots -->
  <g fill="#000">
    <circle cx="110" cy="265" r="3"/><circle cx="180" cy="265" r="3"/><circle cx="340" cy="265" r="3"/>
    <circle cx="460" cy="155" r="3"/><circle cx="650" cy="155" r="3"/>
  </g>
  <g fill="#fff" stroke="#000" stroke-width="1.6">
    <circle cx="460" cy="100" r="5"/><circle cx="650" cy="100" r="5"/><circle cx="410" cy="265" r="5"/>
    <circle cx="710" cy="190" r="5"/><circle cx="710" cy="245" r="5"/><circle cx="710" cy="300" r="5"/>
  </g>

  <!-- labels: bias network -->
  <text x="110" y="42" text-anchor="middle">3V3</text>
  <text x="126" y="125">150 k</text>
  <text x="126" y="320">10 k</text>
  <text x="200" y="320">10 µF</text>
  <text x="118" y="255">B = 0.207 V</text>
  <text x="260" y="248" text-anchor="middle">10 k</text>
  <text x="360" y="320">47 µF</text>
  <text x="330" y="305" text-anchor="end">+</text>
  <text x="340" y="378" text-anchor="middle">Rs top (0 V DC)</text>

  <!-- labels: pins -->
  <text x="404" y="255" text-anchor="end" font-weight="bold">D12 / PA6</text>
  <text x="452" y="92" text-anchor="end" font-weight="bold">D11 / PA7</text>
  <text x="658" y="92" font-weight="bold">A3 / PB0</text>
  <text x="753" y="185" font-weight="bold">A1 / PA1</text>
  <text x="753" y="202" fill="#52514e">ADC channel a</text>
  <text x="753" y="240" font-weight="bold">A2 / PA4</text>
  <text x="753" y="257" fill="#52514e">DAC sine out</text>
  <text x="753" y="295" font-weight="bold">D8 / PA9</text>
  <text x="753" y="312" fill="#52514e">scope trigger</text>

  <!-- labels: inside -->
  <text x="555" y="140" text-anchor="middle">internal R2 ≈ 140 k</text>
  <text x="497" y="230">−</text>
  <text x="497" y="270">+</text>
  <text x="510" y="310">OPAMP2, gain 8</text>
  <text x="510" y="327" fill="#52514e">internal R1 not shown</text>
</svg>
