<text x="72" y="42" font-size="11.5" fill="#52514e">62.5 Hz, 50 periods per point. The raw rms bends up at the low end: the bench noise (about 7 mV rms</text>
<text x="72" y="57" font-size="11.5" fill="#52514e">here) adds in quadrature. The fundamental stays on the line.</text>
