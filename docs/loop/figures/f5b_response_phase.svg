<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-label="Chain response: phase of the loop current against the DAC">
<rect width="760" height="430" fill="#fcfcfb"/>
<text x="72" y="24" font-size="15" font-weight="bold" fill="#0b0b0b">Chain response: phase of the loop current against the DAC</text>
<text x="72" y="42" font-size="11.5" fill="#52514e">The DAC one-sample delay is removed. The phase falls by about 37° from 50 to 250 Hz, zero near 120 Hz,</text>
<text x="72" y="57" font-size="11.5" fill="#52514e">while the gain stays within ±2 %. A single high-pass cannot do both; the cause (amp module or loop)</text>
<text x="72" y="72" font-size="11.5" fill="#52514e">needs the amp-output channel to split.</text>
<rect x="72" y="86.5" width="18" height="3" rx="1.5" fill="#2a78d6" fill-opacity="1"/>
<text x="96" y="92" font-size="12" fill="#52514e">phase</text>
<line x1="72" x2="736" y1="321.5" y2="321.5" stroke="#e6e5e0"/>
<text x="64" y="325.5" text-anchor="end" font-size="11" fill="#52514e">-10</text>
<line x1="72" x2="736" y1="258.9" y2="258.9" stroke="#e6e5e0"/>
<text x="64" y="262.9" text-anchor="end" font-size="11" fill="#52514e">0</text>
<line x1="72" x2="736" y1="196.4" y2="196.4" stroke="#e6e5e0"/>
<text x="64" y="200.4" text-anchor="end" font-size="11" fill="#52514e">10</text>
<line x1="72" x2="736" y1="133.8" y2="133.8" stroke="#e6e5e0"/>
<text x="64" y="137.8" text-anchor="end" font-size="11" fill="#52514e">20</text>
<line x1="110.3" x2="110.3" y1="108" y2="376" stroke="#e6e5e0"/>
<text x="110.3" y="394" text-anchor="middle" font-size="11" fill="#52514e">50</text>
<line x1="362.0" x2="362.0" y1="108" y2="376" stroke="#e6e5e0"/>
<text x="362.0" y="394" text-anchor="middle" font-size="11" fill="#52514e">100</text>
<line x1="613.8" x2="613.8" y1="108" y2="376" stroke="#e6e5e0"/>
<text x="613.8" y="394" text-anchor="middle" font-size="11" fill="#52514e">200</text>
<line x1="72" x2="736" y1="376" y2="376" stroke="#c9c8c2"/>
<text x="404.0" y="418" text-anchor="middle" font-size="12" fill="#52514e">frequency (Hz, log)</text>
<text x="18" y="242.0" text-anchor="middle" font-size="12" fill="#52514e" transform="rotate(-90 18 242.0)">phase (degrees, + = lead)</text>
<clipPath id="pa"><rect x="72" y="108" width="664" height="268"/></clipPath>
