<svg xmlns="http://www.w3.org/2000/svg" width="870" height="745" viewBox="0 0 870 745" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <title>Loop source, stage 1: OPAMP2 in standalone mode, AC gain around a mid-rail bias</title>
  <rect x="0" y="0" width="870" height="745" fill="#ffffff"/>

  <g fill="none" stroke="#000" stroke-width="1.6">
    <!-- bias divider: 3V3 - 20k - B - 20k - GND -->
    <line x1="230" y1="28" x2="230" y2="45"/>
    <rect x="223" y="45" width="14" height="45"/>
    <line x1="230" y1="90" x2="230" y2="125"/>
    <rect x="223" y="125" width="14" height="45"/>
    <line x1="230" y1="170" x2="230" y2="180"/>
    <line x1="218" y1="180" x2="242" y2="180"/><line x1="222" y1="185" x2="238" y2="185"/><line x1="226" y1="190" x2="234" y2="190"/>
    <!-- CB 10 uF from B to GND -->
    <line x1="230" y1="110" x2="170" y2="110"/>
    <line x1="170" y1="110" x2="170" y2="122"/>
    <line x1="158" y1="122" x2="182" y2="122" stroke-width="2.4"/>
    <line x1="158" y1="130" x2="182" y2="130" stroke-width="2.4"/>
    <line x1="170" y1="130" x2="170" y2="145"/>
    <line x1="158" y1="145" x2="182" y2="145"/><line x1="162" y1="150" x2="178" y2="150"/><line x1="166" y1="155" x2="174" y2="155"/>
    <!-- B to R bias 10k to D12 node -->
    <line x1="230" y1="110" x2="360" y2="110"/>
    <line x1="360" y1="110" x2="360" y2="125"/>
    <rect x="353" y="125" width="14" height="45"/>
    <line x1="360" y1="170" x2="360" y2="215"/>
    <!-- input: source - Cin - D12 -->
    <line x1="120" y1="215" x2="280" y2="215"/>
    <line x1="280" y1="203" x2="280" y2="227" stroke-width="2.4"/>
    <line x1="288" y1="203" x2="288" y2="227" stroke-width="2.4"/>
    <line x1="288" y1="215" x2="520" y2="215"/>
    <!-- chip boundary -->
    <rect x="430" y="150" width="290" height="190" stroke-dasharray="6 4" stroke="#555"/>
    <!-- op-amp -->
    <polygon points="520,190 520,290 620,240"/>
    <line x1="520" y1="265" x2="470" y2="265"/>
    <line x1="470" y1="265" x2="470" y2="400"/>
    <line x1="620" y1="240" x2="760" y2="240"/>
    <!-- feedback R2 68k: out - D11 -->
    <line x1="760" y1="240" x2="760" y2="400"/>
    <line x1="760" y1="400" x2="650" y2="400"/>
    <rect x="600" y="393" width="50" height="14"/>
    <line x1="600" y1="400" x2="470" y2="400"/>
    <!-- R1 10k and C1 47 uF: D11 - GND -->
    <line x1="470" y1="400" x2="470" y2="420"/>
    <rect x="463" y="420" width="14" height="45"/>
    <line x1="470" y1="465" x2="470" y2="480"/>
    <line x1="458" y1="480" x2="482" y2="480" stroke-width="2.4"/>
    <line x1="458" y1="488" x2="482" y2="488" stroke-width="2.4"/>
    <line x1="470" y1="488" x2="470" y2="505"/>
    <line x1="458" y1="505" x2="482" y2="505"/><line x1="462" y1="510" x2="478" y2="510"/><line x1="466" y1="515" x2="474" y2="515"/>
  </g>

  <!-- nodes -->
  <g fill="#000">
    <circle cx="230" cy="110" r="3.5"/>
    <circle cx="360" cy="215" r="3.5"/>
    <circle cx="760" cy="240" r="3.5"/>
    <circle cx="470" cy="400" r="3.5"/>
  </g>

  <!-- labels -->
  <g fill="#000">
    <text x="300" y="40" font-size="15" font-weight="bold">Loop source, stage 1: OPAMP2 standalone mode</text>
    <text x="300" y="58" font-size="12" fill="#444">AC gain around a mid-rail bias. Kept for later, not built (2026-11-01).</text>
    <text x="300" y="74" font-size="12" fill="#444">Built instead: internal PGA x8, input biased at 0.21 V (see opamp2_frontend.md).</text>

    <text x="218" y="22">3V3</text>
    <text x="243" y="72">20 k</text>
    <text x="243" y="152">20 k</text>
    <text x="238" y="104" font-size="12">B ≈ 1.65 V</text>
    <text x="110" y="132">10 µF</text>
    <text x="186" y="120">+</text>
    <text x="373" y="152">10 k</text>

    <text x="20" y="208">Rs top (loop)</text>
    <text x="20" y="226" font-size="12" fill="#444">test: A2 (DAC)</text>
    <text x="292" y="200">+</text>
    <text x="262" y="246">47 µF</text>

    <text x="436" y="166" font-size="11" fill="#555">STM32L476, OPAMP2 (OPAMODE 00)</text>
    <text x="436" y="208" font-size="12">PA6 / D12</text>
    <text x="436" y="232" font-size="11" font-style="italic" fill="#1a5fb4">ADC i (IN11)</text>
    <text x="527" y="221" font-size="14">+</text>
    <text x="527" y="270" font-size="14">−</text>
    <text x="476" y="306" font-size="12">PA7 / D11</text>
    <text x="476" y="321" font-size="11" font-style="italic" fill="#1a5fb4">ADC m (IN12)</text>
    <text x="630" y="232" font-size="12">PB0 / A3</text>
    <text x="630" y="258" font-size="11" font-style="italic" fill="#1a5fb4">ADC p (IN15)</text>

    <text x="768" y="236" font-size="12">out ≈ 1.65 V</text>
    <text x="768" y="252" font-size="12">± G · v_in</text>
    <text x="598" y="388">R2 68 k</text>
    <text x="484" y="447">R1 10 k</text>
    <text x="486" y="478">+</text>
    <text x="490" y="494">C1 47 µF</text>
  </g>

  <!-- notes -->
  <rect x="20" y="545" width="830" height="185" fill="#f6f6f6" stroke="#bbb"/>
  <g fill="#000" font-size="12.5">
    <text x="32" y="566">DC gain 1: C1 blocks the DC path through R1, so the output sits on the input bias (≈ 1.65 V).</text>
    <text x="32" y="585">AC gain G = 1 + R2/R1 = 7.8, for ≤ 140 mV rms at D12. For 250 mV rms (Rs 1 Ω at 0.25 A) use R2 = 27 k: G = 3.7.</text>
    <text x="32" y="604">Corner of the gain: 1 / (2π · R1 · C1) = 0.34 Hz. At 50 Hz: −0.02 %, +0.4°. Measured live as p / i, so not trimmed.</text>
    <text x="32" y="623">Input high-pass: 47 µF with ≈ 20 k (10 k + bias Thevenin) = 0.17 Hz. Settle ≈ 5 s after power-up.</text>
    <text x="32" y="642">Electrolytics: + toward D12 and D11 (both at 1.65 V DC; Rs top and GND at 0 V).</text>
    <text x="32" y="661">Firmware: `pga std 7.8` (OPAMP2_CSR: OPAMODE 00, VMSEL 00 = PA7, VPSEL 0 = PA6). Keep A3 free of other loads.</text>
    <text x="32" y="680">Why not the PGA mode: its internal R1 returns to VSSA, and the VINM pin is the R1/R2 junction</text>
    <text x="32" y="699">(measured 2026-11-01), so the PGA mode cannot take a mid-rail reference.</text>
    <text x="32" y="718" fill="#444">Source: BatTester docs/loop/opamp2_frontend.md; digitalSpine todo/fluxStationLoopSource.md §7.1.</text>
  </g>
</svg>
